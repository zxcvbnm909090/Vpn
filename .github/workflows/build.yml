name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show repo files
        run: |
          echo "=== root ==="
          ls -la
          echo "=== zip files ==="
          ls -la *.zip || echo "NO ZIP FOUND"

      - name: Find and unzip project
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "No zip file in repo root"
            exit 1
          fi
          echo "Using: $ZIP"
          unzip -o -q "$ZIP" -d project
          ls -la project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: project/MyVPN
        run: gradle assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MyVPN-debug
          path: project/MyVPN/app/build/outputs/apk/debug/*.apk
